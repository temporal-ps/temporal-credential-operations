# Prometheus scraping every Pod annotated prometheus.io/scrape=true in the
# client namespaces. Pod and namespace become series labels, so each proxy
# replica reports its own loaded leaf.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: tco-prometheus
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: tco-prometheus
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: tco-prometheus
subjects:
  - kind: ServiceAccount
    name: prometheus
    namespace: observability
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s
    rule_files:
      - /etc/prometheus/rules.yml
    scrape_configs:
      - job_name: temporal-proxy
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names: [workers, callers]
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            action: keep
            regex: "true"
          - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
            action: keep
            regex: temporal-proxy
          - source_labels: [__meta_kubernetes_pod_ip, __meta_kubernetes_pod_annotation_prometheus_io_port]
            action: replace
            regex: (.+);(.+)
            replacement: $1:$2
            target_label: __address__
          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
  # Alerts from the spec's Observability section. Demo values: leaf TTL 30m,
  # ESO refresh 10m, two proxy replicas per client namespace. No Alertmanager
  # is deployed; firing alerts show in the Prometheus UI under Alerts.
  rules.yml: |
    groups:
      - name: temporal-proxy-certificates
        rules:
          - alert: TemporalProxyLeafRenewalStalled
            # Two refreshes missed: less than TTL - 2R left on the loaded leaf.
            expr: (tmprl_proxy_tls_cert_expiry_timestamp_seconds{file="cert"} - time()) < (1800 - 2 * 600)
            for: 1m
            labels: {severity: page}
            annotations:
              summary: "{{ $labels.namespace }}/{{ $labels.pod }} leaf expires in {{ $value | humanizeDuration }}; ESO or Vault is not renewing it"
          - alert: TemporalProxyReloadFailed
            expr: increase(tmprl_proxy_tls_reloads_total{result="failure"}[10m]) > 0
            labels: {severity: page}
            annotations:
              summary: "{{ $labels.namespace }}/{{ $labels.pod }} rejected new certificate material and kept its previous leaf"
          - alert: TemporalProxyMissing
            expr: count by (namespace) (tmprl_proxy_tls_cert_expiry_timestamp_seconds{file="cert"}) < 2
            for: 2m
            labels: {severity: page}
            annotations:
              summary: "fewer proxies than expected report a loaded leaf in {{ $labels.namespace }}"
          - alert: TemporalProxyForwardingErrors
            expr: increase(tmprl_proxy_router_forwarding_errors_total[5m]) > 0
            labels: {severity: ticket}
            annotations:
              summary: "{{ $labels.namespace }}/{{ $labels.pod }} failed to forward calls to Temporal Cloud ({{ $labels.reason }})"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  labels:
    app.kubernetes.io/name: prometheus
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: prometheus
  template:
    metadata:
      labels:
        app.kubernetes.io/name: prometheus
    spec:
      serviceAccountName: prometheus
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        fsGroup: 65534
      containers:
        - name: prometheus
          image: prom/prometheus:v3.5.0
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time=2d
          ports:
            - name: http
              containerPort: 9090
          readinessProbe:
            httpGet:
              path: /-/ready
              port: http
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
            - name: data
              mountPath: /prometheus
      volumes:
        - name: config
          configMap:
            name: prometheus-config
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
spec:
  selector:
    app.kubernetes.io/name: prometheus
  ports:
    - name: http
      port: 9090
      targetPort: http
