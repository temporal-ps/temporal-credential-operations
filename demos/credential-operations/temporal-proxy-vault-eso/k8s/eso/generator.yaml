# Each ESO refresh POSTs to Vault's PKI issue endpoint and gets a new leaf and
# private key. The key is generated by Vault, returned once, and not stored
# by Vault (role no_store=true). The client namespace overlay sets the Vault
# role and the common name.
apiVersion: generators.external-secrets.io/v1alpha1
kind: VaultDynamicSecret
metadata:
  name: temporal-cloud-leaf
spec:
  method: POST
  path: /pki-temporal/issue/temporal-client
  parameters:
    common_name: REPLACED_BY_OVERLAY
  resultType: Data
  provider:
    server: http://vault.vault.svc.cluster.local:8200
    auth:
      kubernetes:
        mountPath: kubernetes
        role: REPLACED_BY_OVERLAY
        serviceAccountRef:
          name: vault-pki-client
          audiences: ["vault"]
